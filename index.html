<!DOCTYPE html>
<html Lang="en">

<head>
    <meta charset="utf-8">
    <title>Home Page</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='index.css'>
    <script src='index.js'></script>
</head>
<body>
    <h1>Welcome to Solitare!</h1>
    
    
        <!-- Images used to open the lightbox -->
    <div class="row">
    <div class="column">
        <h1 onclick="openModal();currentSlide(1)">Visual Settings</h1>
    </div>
    <div class="column">
        <h1 onclick="openModal();currentSlide(3)">Gameplay Settings</h1>
    </div>
    </div>

    <!-- The Modal/Lightbox -->
    <div id="myModal" class="modal">
    <span class="close cursor" onclick="closeModal()">&times;</span>
    <div class="modal-content">

        <div class="mySlides">
        <div class="numbertext">Visual Settings</div>
            <h2 class="settingsContent topSetting" >Background Color</h2>
        </div>
        <div class="mySlides">
            <div class="numbertext">Visual Settings</div>
            <h2 class="settingsContent topSetting">Card Face</h2>
        </div>

        <div class="mySlides">
        <div class="numbertext">Gameplay Settings</div>
            <h2 class="settingsContent topSetting">Draw Number</h2>
        </div>
    </div>

        
    <!-- Next/previous controls -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>
        

        <!-- Caption text -->
        <div class="caption-container">
        <p id="caption"></p>
        </div>

        <!-- Thumbnail image controls -->
        <div class="column">
            <h3 onclick="currentSlide(1)" class="thumbNavigation">Visual Settings</h3>
        </div>

        <div class="column">
            <h3 onclick="currentSlide(3)" class="thumbNavigation">Gameplay Settings</h3>
        </div>

       
    </div>
    </div>
</body>
</html>
